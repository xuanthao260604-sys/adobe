<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><text x="12" y="15" font-family="DejaVu Sans" font-size="6" fill="#302d3c">SAKURA / 05 — LẮP RÁP &amp; VẬT LIỆU</text><text x="12" y="24" font-family="DejaVu Sans" font-size="3.5" fill="#302d3c">Đơn vị mm • Bản mẫu thủ công EVA • Khổ 420 × 297 mm</text><text x="12" y="44" font-family="DejaVu Sans" font-size="4" fill="#302d3c">01 / CẮT &amp; THỬ</text><text x="12" y="53" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Cắt A1 liền nối. Thử T1, đo EVA thực tế.</text><rect x="27" y="64" width="20" height="35" rx="0" fill="#49346c" stroke="#d52648" stroke-width="0.4"/><rect x="62" y="64" width="36" height="35" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><rect x="69.75" y="69" width="20.5" height="30" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><text x="147" y="44" font-family="DejaVu Sans" font-size="4" fill="#302d3c">02 / DÁN CHUÔI</text><text x="147" y="53" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Dán B3 lên B2, giữ rãnh sạch keo.</text><rect x="157" y="64" width="90" height="6" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><rect x="165" y="73" width="90" height="6" rx="0" fill="#49346c" stroke="#d52648" stroke-width="0.4"/><rect x="173" y="82" width="90" height="6" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><text x="282" y="44" font-family="DejaVu Sans" font-size="4" fill="#302d3c">03 / GHÉP NỐI</text><text x="282" y="53" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Luồn C1, đưa nối vào rãnh, dán B1.</text><rect x="292" y="71" width="50" height="20" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><rect x="348" y="64" width="10" height="34" rx="0" fill="#ba8b44" stroke="#d52648" stroke-width="0.4"/><rect x="365" y="76" width="35" height="10" rx="0" fill="#49346c" stroke="#d52648" stroke-width="0.4"/><path d="M 392 101 h -70 l 5 -3 m -5 3 l 5 3" fill="none" stroke="#777" stroke-width="0.45" /><text x="12" y="130" font-family="DejaVu Sans" font-size="4" fill="#302d3c">04 / TRANG TRÍ</text><text x="12" y="139" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Dán C2, quấn dây, dán hoa và viền.</text><g id="C1_guard" inkscape:groupmode="layer" inkscape:label="C1_guard" transform="translate(74 163)"><path d="M -65 0 Q -56 -18 -31 -13 Q -18 -26 0 -14 Q 18 -26 31 -13 Q 56 -18 65 0 Q 56 18 31 13 Q 18 26 0 14 Q -18 26 -31 13 Q -56 18 -65 0 Z" fill="#ba8b44" stroke="#d52648" stroke-width="0.45" /><rect x="-10.5" y="-5.5" width="21" height="11" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/></g><ellipse cx="0" cy="-4.95" rx="3.5100000000000002" ry="5.3999999999999995" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(74 163) rotate(0)"/><ellipse cx="0" cy="-4.95" rx="3.5100000000000002" ry="5.3999999999999995" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(74 163) rotate(72)"/><ellipse cx="0" cy="-4.95" rx="3.5100000000000002" ry="5.3999999999999995" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(74 163) rotate(144)"/><ellipse cx="0" cy="-4.95" rx="3.5100000000000002" ry="5.3999999999999995" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(74 163) rotate(216)"/><ellipse cx="0" cy="-4.95" rx="3.5100000000000002" ry="5.3999999999999995" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(74 163) rotate(288)"/><circle cx="74" cy="163" r="1.71" fill="#ba8b44"/><text x="147" y="130" font-family="DejaVu Sans" font-size="4" fill="#302d3c">05 / LÀM VỎ KÍN</text><text x="147" y="139" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Dán D1 × 2; sơn, thêm cành hoa.</text><rect x="157" y="155" width="100" height="13" rx="5" fill="#f5eef8" stroke="#ba8b44" stroke-width="0.4"/><ellipse cx="0" cy="-4.4" rx="3.12" ry="4.8" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(192 161) rotate(0)"/><ellipse cx="0" cy="-4.4" rx="3.12" ry="4.8" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(192 161) rotate(72)"/><ellipse cx="0" cy="-4.4" rx="3.12" ry="4.8" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(192 161) rotate(144)"/><ellipse cx="0" cy="-4.4" rx="3.12" ry="4.8" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(192 161) rotate(216)"/><ellipse cx="0" cy="-4.4" rx="3.12" ry="4.8" fill="#efa9c6" stroke="#ba668e" stroke-width=".3" transform="translate(192 161) rotate(288)"/><circle cx="192" cy="161" r="1.52" fill="#ba8b44"/><text x="282" y="130" font-family="DejaVu Sans" font-size="4" fill="#302d3c">06 / TRƯNG BÀY</text><text x="282" y="139" font-family="DejaVu Sans" font-size="2.9" fill="#302d3c">Để keo khô theo nhãn; đỡ cả thân và chuôi.</text><path d="M 297 170 h 95 m -80 0 v 12 m 65 -12 v 12" fill="none" stroke="#ba8b44" stroke-width="2" /><rect x="292" y="155" width="105" height="10" rx="4" fill="#49346c" stroke="#ba8b44" stroke-width="0.4"/><text x="12" y="223" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Vật liệu dự kiến: EVA 10 mm (1 tấm 500 × 1.000); EVA 5 mm (1 tấm 500 × 1.000).</text><text x="12" y="233" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">EVA 1 mm/giấy màu; ruy băng 8 mm × 1,2 m; keo tương thích EVA; sơn gốc nước.</text><text x="12" y="243" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Không dùng lõi kim loại, không mài sắc. Mô hình mềm chỉ dùng trang trí.</text><text x="12" y="253" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Vỏ kín độc lập: KHÔNG tra thân vào. Muốn vỏ rỗng cần bản thiết kế khác.</text><text x="12" y="263" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Kiểm tra in 100 mm → thử T1 → cắt kết cấu → thử khô → dán → trang trí.</text><text x="12" y="277" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Đã kiểm tra hình học số; chưa chế tạo thử, chưa xác nhận độ khít vật liệu thật.</text></svg>