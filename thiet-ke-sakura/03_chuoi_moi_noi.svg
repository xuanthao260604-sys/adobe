<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="420mm" height="310mm" viewBox="0 0 420 310"><rect width="420" height="310" fill="white"/><text x="12" y="15" font-family="DejaVu Sans" font-size="6" fill="#302d3c">SAKURA / 03 — CHUÔI &amp; MỐI NỐI 1:1</text><text x="12" y="24" font-family="DejaVu Sans" font-size="3.5" fill="#302d3c">Đơn vị mm • Bản mẫu thủ công EVA • Khổ 420 × 310 mm</text><text x="12" y="36" font-family="DejaVu Sans" font-size="4" fill="#302d3c">Chọn thanh nối trước: A1 = 20 rộng × 10 dày × 80 dài mm.</text><text x="12" y="44" font-family="DejaVu Sans" font-size="3.8" fill="#302d3c">Qua chắn C1 dày 10 → phần ngậm trong chuôi 70 mm.</text><rect x="20" y="65" width="250" height="36" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><rect x="197.5" y="72.75" width="72.5" height="20.5" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><text x="22" y="60" font-family="DejaVu Sans" font-size="3.5" fill="#302d3c">B3 / EVA 10 mm / 250 × 36; cắt bỏ rãnh đỏ bên phải</text><text x="24" y="88" font-family="DejaVu Sans" font-size="3.2" fill="#302d3c">Phần giữ lại: 177,5 × 36</text><text x="177" y="111" font-family="DejaVu Sans" font-size="3.5" fill="#302d3c">Rãnh hở đầu: 20,5 × 72,5 × 10</text><text x="12" y="126" font-family="DejaVu Sans" font-size="3.5" fill="#302d3c">Mặt cắt lắp: B1 5 mm + B3 10 mm + B2 5 mm = chuôi dày 20 mm</text><rect x="20" y="137" width="250" height="5" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><rect x="20" y="142" width="177.5" height="10" rx="0" fill="#49346c" stroke="#d52648" stroke-width="0.4"/><rect x="20" y="152" width="250" height="5" rx="0" fill="#f5eef8" stroke="#d52648" stroke-width="0.4"/><rect x="200" y="142" width="70" height="10" rx="0" fill="#bd9cd7" stroke="#d52648" stroke-width="0.4"/><rect x="270" y="137" width="10" height="20" rx="0" fill="#ba8b44" stroke="#d52648" stroke-width="0.4"/><rect x="280" y="142" width="45" height="10" rx="0" fill="#49346c" stroke="#d52648" stroke-width="0.4"/><text x="25" y="168" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Chừa 2,5 mm cuối rãnh; khe rộng dư 0,5 mm tổng.</text><text x="25" y="177" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">Chiều dày rãnh = EVA đo thực tế; chỉnh lớp đệm trước khi dán kín.</text><text x="12" y="194" font-family="DejaVu Sans" font-size="3.7" fill="#302d3c">T1 thử khớp: cắt từ phế liệu cùng tấm trước khi làm chuôi.</text><rect x="20" y="205" width="20" height="40" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><text x="18" y="253" font-family="DejaVu Sans" font-size="3" fill="#302d3c">Nối thử 20 × 40</text><rect x="85" y="205" width="36" height="45" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><rect x="92.75" y="215" width="20.5" height="35" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><text x="80" y="258" font-family="DejaVu Sans" font-size="3" fill="#302d3c">Rãnh thử 20,5</text><text x="145" y="213" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">1. Thử khô; phải trượt vào bằng tay, không ép mạnh.</text><text x="145" y="224" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">2. Chật: nới rãnh từng 0,2 mm; lỏng: thêm giấy đệm.</text><text x="145" y="235" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">3. Keo thủ công tương thích EVA; thử trên phế liệu.</text><text x="145" y="246" font-family="DejaVu Sans" font-size="3.4" fill="#302d3c">4. Không sơn hoặc dán phủ bề mặt mối nối trước thử khít.</text><text x="12" y="267" font-family="DejaVu Sans" font-size="3.3" fill="#302d3c">Đỏ liền: CẮT • Xanh đứt: GẤP • Xám chấm: THAM CHIẾU</text><path d="M 12 272 h 45" fill="none" stroke="#278dba" stroke-width="0.4" stroke-dasharray="4 2"/><path d="M 70 272 h 45" fill="none" stroke="#888" stroke-width="0.4" stroke-dasharray="1 2"/><rect x="12" y="279" width="100" height="10" rx="0" fill="none" stroke="#d52648" stroke-width="0.4"/><text x="12" y="295" font-family="DejaVu Sans" font-size="3.3" fill="#302d3c">Ô kiểm tra: 100 × 10 mm. In 100%, không Fit to page.</text></svg>